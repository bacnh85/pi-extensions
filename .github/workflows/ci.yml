name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        include:
          - package: pi-agy
            test-command: npm ci && npm test && npm run typecheck
          - package: pi-ponytail
            test-command: node --test extensions/test/*.test.js
          - package: pi-serena
            test-command: npm ci && npm test
          - package: pi-web
            test-command: npm ci && npm test
          - package: pi-munin
            test-command: npm ci && npm test
          - package: pi-plan
            test-command: npm ci && npm test && npm run typecheck
          - package: pi-subagent
            test-command: npm ci && npm test && npm run typecheck
          - package: pi-review
            test-command: npm ci && npm test && npm run typecheck
          - package: pi-fff
            test-command: npm ci && npm test
          - package: pi-notebooklm
            test-command: npm ci && npm test
          - package: pi-rtk
            test-command: npm pack --dry-run
          - package: pi-sub
            test-command: npm pack --dry-run
          - package: pi-deepseek-tools
            test-command: npm ci && npm test
          - package: pi-obsidian
            test-command: npm ci && npm test
          - package: pi-windows-tools
            test-command: npm ci && npm test
    defaults:
      run:
        working-directory: ./${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Detect changes
        id: check
        run: |
          # workflow_dispatch = manual trigger, run everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "-> Manual trigger, testing all packages"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            # pathspec is '.' because defaults.run.working-directory is already the package dir
            CHANGES=$(git diff --name-only "$BASE"...HEAD -- .)
          else
            # first push or no base — run everything to be safe
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "-> First push or no base, testing package"
            exit 0
          fi

          if [ -n "$CHANGES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Test
        if: steps.check.outputs.changed == 'true'
        run: ${{ matrix.test-command }}

      - name: Publish
        if: |
          steps.check.outputs.changed == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push'
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PKG" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VER" ]; then
            echo "-> Version $VER already published, skipping"
          else
            echo "-> Publishing $VER (was ${PUBLISHED:-none})"
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
