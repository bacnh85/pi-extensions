name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: duplicate triggers (e.g. two push events for the same commit)
# cancel the obsolete run instead of racing the npm view → npm publish check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which packages have changed, build a dynamic matrix
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Supply-chain guard (issue #16): every lockfile entry with a `resolved`
      # URL must carry an `integrity` hash — otherwise npm ci installs an
      # unverifiable tarball. Runs after checkout (it was originally placed
      # before checkout and scanned an empty workspace, i.e. never ran).
      - name: Verify lockfile integrity coverage
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          bad = []
          for lp in sorted(glob.glob('*/package-lock.json')):
              for name, node in json.load(open(lp)).get('packages', {}).items():
                  if node.get('resolved') and not node.get('integrity'):
                      bad.append(f"{lp}: {name}@{node.get('version')}")
          if bad:
              print("Lockfile entries missing integrity:"); [print(" -", b) for b in bad]
              sys.exit(1)
          print(f"All lockfile entries carry integrity hashes.")
          EOF

      # Hardening round 6: every pi-* directory must appear in BOTH the
      # paths-filter map and the matrix — a package missing from either is
      # silently never tested/published (pi-windows-tools drifted out this way;
      # fixed in c13fa72). Fails the changes job on any future drift.
      - name: Verify matrix/paths-filter parity with package dirs
        run: |
          python3 - <<'EOF'
          import os, re, sys
          yml = open('.github/workflows/ci.yml').read()
          filters = set(re.findall(r"^\s+(pi-[a-z0-9-]+): pi-[a-z0-9-]+/\*\*$", yml, re.M))
          matrix = set(re.findall(r"\{ pkg: '(pi-[a-z0-9-]+)'", yml))
          dirs = set(d for d in os.listdir('.') if d.startswith('pi-') and os.path.isdir(d))
          problems = []
          if dirs - filters:
              problems.append(f"package dirs missing from paths-filter: {sorted(dirs - filters)}")
          if filters - matrix:
              problems.append(f"filters missing from matrix: {sorted(filters - matrix)}")
          if matrix - dirs:
              problems.append(f"matrix entries without a package dir: {sorted(matrix - dirs)}")
          if problems:
              print("CI matrix drift detected:")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print(f"Matrix parity OK: {len(dirs)} packages covered by filter + matrix.")
          EOF

      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        id: filter
        with:
          filters: |
            pi-agy: pi-agy/**
            pi-ponytail: pi-ponytail/**
            pi-serena: pi-serena/**
            pi-web: pi-web/**
            pi-munin: pi-munin/**
            pi-plan: pi-plan/**
            pi-advisor: pi-advisor/**
            pi-subagent: pi-subagent/**
            pi-review: pi-review/**
            pi-fff: pi-fff/**
            pi-notebooklm: pi-notebooklm/**
            pi-rtk: pi-rtk/**
            pi-sub: pi-sub/**
            pi-model-tools: pi-model-tools/**
            pi-obsidian: pi-obsidian/**
            pi-kicad: pi-kicad/**
            pi-router: pi-router/**
            pi-commandcode: pi-commandcode/**
            pi-ux: pi-ux/**
            pi-budget: pi-budget/**
            pi-themes: pi-themes/**
            pi-init: pi-init/**
            pi-permission: pi-permission/**
            pi-checkpoint: pi-checkpoint/**
            pi-notify: pi-notify/**
            pi-references: pi-references/**
            pi-evolve: pi-evolve/**
            pi-a2a: pi-a2a/**
            pi-config-panel: pi-config-panel/**
            pi-hub: pi-hub/**
            pi-attachments: pi-attachments/**
            pi-selfskills: pi-selfskills/**
            pi-cron: pi-cron/**
            pi-windows-tools: pi-windows-tools/**

      - name: Build matrix
        id: set-matrix
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const all = [
              { pkg: 'pi-agy', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-ponytail', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-serena', cmd: 'npm ci && npm test' },
              { pkg: 'pi-web', cmd: 'npm ci && npm test' },
              { pkg: 'pi-munin', cmd: 'npm ci && npm test' },
              { pkg: 'pi-plan', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-advisor', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-subagent', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-review', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-fff', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-notebooklm', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-rtk', cmd: 'npm ci && npm test && npm run typecheck && npm pack --dry-run' },
              { pkg: 'pi-sub', cmd: 'npm ci && npm test' },
              { pkg: 'pi-model-tools', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-obsidian', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-router', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-commandcode', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-kicad', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-ux', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-budget', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-themes', cmd: 'npm test' },
              { pkg: 'pi-init', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-permission', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-checkpoint', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-notify', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-references', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-evolve', cmd: 'npm ci && npm test' },
              { pkg: 'pi-a2a', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-config-panel', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-hub', cmd: 'node --test extensions/test/*.test.js' },
              { pkg: 'pi-attachments', cmd: 'npm ci && npm test && npm run typecheck' },
              { pkg: 'pi-selfskills', cmd: 'npm ci && npm test' },
            { pkg: 'pi-cron', cmd: 'npm ci && npm test && npm run typecheck' },
            { pkg: 'pi-windows-tools', cmd: 'npm ci && npm test && npm run typecheck' },
            ];

            const selected = '${{ github.event_name }}' === 'workflow_dispatch'
              ? all
              : all.filter(p => JSON.parse('${{ steps.filter.outputs.changes }}').includes(p.pkg));

            const include = selected.map(p => ({
              package: p.pkg,
              'test-command': p.cmd,
              runner: '"ubuntu-latest"',
            }));

            core.setOutput('matrix', JSON.stringify({ include }));

  # Test and publish only the changed packages
  ci:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        working-directory: ./${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Test
        run: ${{ matrix.test-command }}

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PKG" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VER" ]; then
            echo "-> Version $VER already published, skipping"
          else
            echo "-> Publishing $VER (was ${PUBLISHED:-none})"
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
