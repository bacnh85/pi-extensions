name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: pi-ponytail
            test-command: node --test extensions/test/*.test.js
          - package: pi-serena
            test-command: npm ci && npm test
          - package: pi-web
            test-command: npm ci && npm test
          - package: pi-munin
            test-command: npm ci && npm test
    defaults:
      run:
        working-directory: ./${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ${{ matrix.test-command }}
